[package]
name = "host"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmi = "2.0.0-beta.10"
wasmtime = { version = "47", default-features = false, features = ["cranelift", "runtime", "std"] }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
slh-dsa = { version = "0.1", default-features = false, features = ["alloc"] }
signature = "=2.3.0-pre.4"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
