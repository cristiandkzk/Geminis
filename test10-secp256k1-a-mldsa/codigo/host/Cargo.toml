[package]
name = "vm-firma10"
version = "0.1.0"
edition = "2021"

# Como el de Test 9, con secp256k1 en lugar de Ed25519:
#   firmar / verificar / nativo   — igual que en Test 9
#   recuperar                      — `ecrecover` en la maquina, y la direccion de Ethereum de lo recuperado
#   alterar-s                      — la firma maleable (`s' = n - s`) que EIP-2 prohibe
[dependencies]
vm = { path = "../../../geminis/predicado/vm" }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
sha3 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
