[package]
name = "guest-ed25519-io"
version = "0.1.0"
edition = "2021"

# El mismo crate y el mismo perfil que `test8-ed25519/`; lo unico que cambia es la ABI: aca la
# clave, la firma y el mensaje **entran por memoria**, como los recibiria un predicado real.
[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
