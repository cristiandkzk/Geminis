[package]
name = "guest-ed25519"
version = "0.1.0"
edition = "2021"

# Tercero a proposito, igual que el guest de ML-DSA de Test 2 (que usa el crate `ml-dsa` de
# RustCrypto): se mide *la implementacion de referencia del ecosistema*, no una escrita a
# mano. El numero depende de esa eleccion y RESULTS lo dice. `fast` = tablas precomputadas
# de la base, que es la configuracion por defecto de ed25519-dalek.
[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }

# El mismo perfil que `test2-interprete/telefono/guest-rv`.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
